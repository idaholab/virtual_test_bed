name: VTB Assistant CI

on:
  pull_request:
    paths:
      - "vtb_assistant/**"
  push:
    branches: [devel]
    paths:
      - "vtb_assistant/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vtb_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
